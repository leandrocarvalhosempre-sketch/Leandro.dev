.bow-wrap{ text-align:center; font-family: Arial, sans-serif; color:#eaf7ea; }
#bowCanvas{

        js: `
var canvas = document.getElementById("bowCanvas");
var ctx = canvas.getContext("2d");
var W = canvas.width, H = canvas.height;
var anchor = { x: 70, y: H / 2 };
var target = { x: W - 70, y: H / 2, r: 28, baseY: H / 2 };
var arrows = [];
var score = 0;
var scoreEl = document.getElementById("score");
var dragging = false;
var pull = { x: anchor.x, y: anchor.y };
var maxPull = 70;
var startTime = performance.now();

function getPos(evt){
  var rect = canvas.getBoundingClientRect();
  var scaleX = canvas.width / rect.width;
  var scaleY = canvas.height / rect.height;
  var clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
  var clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
  return {
    x: (clientX - rect.left) * scaleX,
    y: (clientY - rect.top) * scaleY
  };
}

function clampPull(p){
  var dx = p.x - anchor.x;
  var dy = p.y - anchor.y;
  var dist = Math.sqrt(dx * dx + dy * dy);
  if (dist > maxPull){
    dx = dx / dist * maxPull;
    dy = dy / dist * maxPull;
  }
  return { x: anchor.x + dx, y: anchor.y + dy };
}

function solta(){
  if (!dragging) return;
  dragging = false;
  var dx = anchor.x - pull.x;
  var dy = anchor.y - pull.y;
  arrows.push({ x: anchor.x, y: anchor.y, vx: dx * 0.18, vy: dy * 0.18, hit: false });
  pull = { x: anchor.x, y: anchor.y };
}

canvas.addEventListener("mousedown", function(e){ dragging = true; pull = clampPull(getPos(e)); });
canvas.addEventListener("mousemove", function(e){ if (dragging) pull = clampPull(getPos(e)); });
window.addEventListener("mouseup", solta);

canvas.addEventListener("touchstart", function(e){ dragging = true; pull = clampPull(getPos(e)); e.preventDefault(); }, { passive: false });
canvas.addEventListener("touchmove", function(e){ if (dragging) pull = clampPull(getPos(e)); e.preventDefault(); }, { passive: false });
window.addEventListener("touchend", solta);

function drawBackground(){
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "rgba(255,255,255,.15)";
  ctx.fillRect(0, H - 30, W, 30);
}

function drawTarget(){
  var rings = ["#ffffff", "#ff4d4d", "#ffffff", "#333333"];
  for (var i = 0; i < rings.length; i++){
    var rr = target.r - i * 7;
    if (rr <= 0) break;
    ctx.beginPath();
    ctx.fillStyle = rings[i];
    ctx.arc(target.x, target.y, rr, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawBow(){
  ctx.strokeStyle = "#5b3a1e";
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(anchor.x, anchor.y - 70);
  ctx.quadraticCurveTo(anchor.x - 34, anchor.y, anchor.x, anchor.y + 70);
  ctx.stroke();

  ctx.strokeStyle = "rgba(255,255,255,.85)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(anchor.x, anchor.y - 70);
  ctx.lineTo(pull.x, pull.y);
  ctx.lineTo(anchor.x, anchor.y + 70);
  ctx.stroke();

  var dx = anchor.x - pull.x;
  var dy = anchor.y - pull.y;
  var len = Math.sqrt(dx * dx + dy * dy) || 1;
  var ux = dx / len, uy = dy / len;
  ctx.strokeStyle = "#e8d9b0";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(pull.x, pull.y);
  ctx.lineTo(pull.x + ux * 40, pull.y + uy * 40);
  ctx.stroke();
}

function updateArrows(){
  for (var i = arrows.length - 1; i >= 0; i--){
    var a = arrows[i];
    if (a.hit) continue;
    a.x += a.vx;
    a.y += a.vy;
    var ddx = a.x - target.x;
    var ddy = a.y - target.y;
    if (Math.sqrt(ddx * ddx + ddy * ddy) < target.r){
      a.hit = true;
      score += 1;
      scoreEl.textContent = score;
    }
    if (a.x > W + 20 || a.x < -20 || a.y < -20 || a.y > H + 20){
      arrows.splice(i, 1);
    }
  }
}

function drawArrows(){
  ctx.strokeStyle = "#3a2b1a";
  ctx.lineWidth = 3;
  for (var i = 0; i < arrows.length; i++){
    var a = arrows[i];
    if (a.hit) continue;
    var angle = Math.atan2(a.vy, a.vx);
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(-18, 0);
    ctx.lineTo(6, 0);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(6, 0);
    ctx.lineTo(0, -4);
    ctx.lineTo(0, 4);
    ctx.closePath();
    ctx.fillStyle = "#3a2b1a";
    ctx.fill();
    ctx.restore();
  }
}

function loop(){
  var t = performance.now() - startTime;
  target.y = target.baseY + Math.sin(t * 0.0015) * 70;

  drawBackground();
  drawTarget();
  updateArrows();
  drawArrows();
  drawBow();

  requestAnimationFrame(loop);
}

loop();`

var linhas = [
  "def insertion_sort(a):",
  "    n = len(a)",
  "    for i in range(1, n):",
  "        key = a[i]",
  "        j = i",
  "        while j > 0 and a[j - 1] > key:",
  "            a[j] = a[j - 1]",
  "            j -= 1",
  "        a[j] = key"
];

var codeEl = document.getElementById("insCode");
var linhaEls = [];
for (var i = 0; i < linhas.length; i++){
  var div = document.createElement("div");
  div.textContent = linhas[i];
  codeEl.appendChild(div);
  linhaEls.push(div);
}

var barsEl = document.getElementById("insBars");
var barEls = [];

function novoArray(){
  var arr = [];
  for (var i = 0; i < 9; i++){ arr.push(1 + Math.floor(Math.random() * 40)); }
  return arr;
}

function construirBarras(arr){
  barsEl.innerHTML = "";
  barEls = [];
  var max = Math.max.apply(null, arr);
  for (var i = 0; i < arr.length; i++){
    var bar = document.createElement("div");
    bar.className = "ins-bar";
    bar.style.height = (14 + (arr[i] / max) * 120) + "px";
    var label = document.createElement("span");
    label.textContent = arr[i];
    bar.appendChild(label);
    barsEl.appendChild(bar);
    barEls.push(bar);
  }
}

function gerarPassos(arrOriginal){
  var passos = [];
  var a = arrOriginal.slice();
  var n = a.length;
  passos.push({ arr: a.slice(), linha: 2, ativo: null, comparando: null });
  for (var i = 1; i < n; i++){
    passos.push({ arr: a.slice(), linha: 3, ativo: i, comparando: null });
    var key = a[i];
    var j = i;
    passos.push({ arr: a.slice(), linha: 4, ativo: i, comparando: null });
    passos.push({ arr: a.slice(), linha: 5, ativo: i, comparando: null });
    while (j > 0 && a[j - 1] > key){
      passos.push({ arr: a.slice(), linha: 6, ativo: j, comparando: j - 1 });
      a[j] = a[j - 1];
      passos.push({ arr: a.slice(), linha: 7, ativo: j, comparando: j - 1 });
      j -= 1;
      passos.push({ arr: a.slice(), linha: 8, ativo: j, comparando: null });
    }
    a[j] = key;
    passos.push({ arr: a.slice(), linha: 9, ativo: j, comparando: null });
  }
  passos.push({ arr: a.slice(), linha: null, ativo: null, comparando: null, feito: true });
  return passos;
}

var passos = [];
var passoAtual = 0;
var timer = null;

function desenharPasso(){
  var passo = passos[passoAtual];
  var max = Math.max.apply(null, passo.arr);

  for (var i = 0; i < barEls.length; i++){
    var bar = barEls[i];
    bar.style.height = (14 + (passo.arr[i] / max) * 120) + "px";
    bar.querySelector("span").textContent = passo.arr[i];
    bar.className = "ins-bar";
    if (passo.feito){
      bar.classList.add("done");
    } else if (i === passo.comparando){
      bar.classList.add("compare");
    } else if (i === passo.ativo){
      bar.classList.add("key");
    }
  }

  for (var l = 0; l < linhaEls.length; l++){
    linhaEls[l].className = (passo.linha === l + 1) ? "ativa" : "";
  }
}

function proximoPasso(){
  if (passoAtual < passos.length - 1){
    passoAtual += 1;
    desenharPasso();
  } else {
    clearInterval(timer);
  }
}

function iniciar(){
  clearInterval(timer);
  var arr = novoArray();
  construirBarras(arr);
  passos = gerarPassos(arr);
  passoAtual = 0;
  desenharPasso();
  timer = setInterval(proximoPasso, 550);
}

document.getElementById("insRestart").addEventListener("click", iniciar);

iniciar();`

    /* ========================================================= */

    function montarFonte(item){
      // Monta as tags por concatenação (nunca escritas por extenso no
      // arquivo). Isso evita dois problemas:
      // 1) fechar o <script> real da página se algum editor "corrigir"
      //    um escape sem querer;
      // 2) o Live Server (auto-reload do VS Code) confundir a tag de
      //    fechamento do body de mentira, que faz parte do preview de
      //    cada snippet, com a tag real da página e injetar o script
      //    dele bem no meio do nosso JavaScript.
      const tag = (nome) => "<" + nome + ">";
      const tagFecha = (nome) => "<" + "/" + nome + ">";
      const abreScript = tag("script");
      const fechaScript = tagFecha("script");

      const partes = [
        "<!doctype html>",
        tag("html"),
        tag("head"),
        '<meta charset="utf-8">',
        tag("style"),
        "  html,body{",
        "    margin:0; height:100%;",
        "    display:flex; align-items:center; justify-content:center;",
        "    background:#0a0a0a; color:#fff;",
        "    font-family:Arial, sans-serif;",
        "  }",
        item.css || "",
        tagFecha("style"),
        tagFecha("head"),
        tag("body"),
        item.html || "",
        abreScript + (item.js || "") + fechaScript,
        tagFecha("body"),
        tagFecha("html")
      ];

      return partes.join("\n");
    }

    function codigoLegivel(item){
      let partes = [];
      if(item.html && item.html.trim()) partes.push(`<!-- HTML -->\n${item.html.trim()}`);
      if(item.css && item.css.trim()) partes.push(`/* CSS */\n${item.css.trim()}`);
      if(item.js && item.js.trim()) partes.push(`// JavaScript\n${item.js.trim()}`);
      return partes.join("\n\n");
    }

    function escapeHtml(str){
      return str
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");
    }

    function criarCardCodigo(item, idx){
      const card = document.createElement("article");
      card.className = "code-card";
      card.style.animationDelay = (0.06 * (idx + 1)) + "s";

      const tagsHtml = (item.tags || [])
        .map(t => '<span class="code-tag">' + t + '</span>')
        .join("");

      card.innerHTML = `
        <div class="code-window">
          <div class="code-window-bar">
            <span class="dot dot-red"></span>
            <span class="dot dot-yellow"></span>
            <span class="dot dot-green"></span>
            <span class="code-window-title">${item.titulo}</span>
          </div>
          <iframe class="code-preview" loading="lazy"></iframe>
        </div>

        <div class="code-info">
          <div class="code-info-top">
            <h2 class="code-title">${item.titulo}</h2>
            <div class="code-tags">${tagsHtml}</div>
          </div>
          ${item.fonte ? ('<p class="code-fonte">Fonte: ' + item.fonte + '</p>') : ""}

          <div class="code-actions">
            <button class="btn-green btn-small btn-ver-codigo">Ver código</button>
            <button class="btn-green btn-small btn-copiar">Copiar código</button>
          </div>

          <pre class="code-block" hidden><code></code></pre>
        </div>
      `;

      const iframe = card.querySelector(".code-preview");
      iframe.srcdoc = montarFonte(item);
      if (item.previewAltura){
        iframe.style.height = item.previewAltura + "px";
      }

      const codeBlock = card.querySelector(".code-block");
      const codeEl = codeBlock.querySelector("code");
      const fonteTexto = codigoLegivel(item);
      codeEl.innerHTML = escapeHtml(fonteTexto);

      card.querySelector(".btn-ver-codigo").addEventListener("click", (e) => {
        const escondido = codeBlock.hasAttribute("hidden");
        if(escondido){
          codeBlock.removeAttribute("hidden");
          e.target.textContent = "Esconder código";
        } else {
          codeBlock.setAttribute("hidden", "");
          e.target.textContent = "Ver código";
        }
      });

      card.querySelector(".btn-copiar").addEventListener("click", async (e) => {
        try{
          await navigator.clipboard.writeText(fonteTexto);
          const original = e.target.textContent;
          e.target.textContent = "Copiado! ✅";
          setTimeout(() => { e.target.textContent = original; }, 1600);
        }catch(err){
          alert("Não foi possível copiar automaticamente. Selecione o código manualmente.");
        }
      });

      return card;
    }

    var PAGINA_TAMANHO = 4;
    var paginaAtual = 1;

    function totalPaginas(){
      return Math.max(1, Math.ceil(codeSnippets.length / PAGINA_TAMANHO));
    }

    function renderizarCodigos(){
      const grid = document.getElementById("codigos-grid");
      grid.innerHTML = "";

      if(!codeSnippets.length){
        grid.innerHTML = `
          <div class="about-card" style="grid-column: 1 / -1;">
            <h2>Nenhum código cadastrado ainda</h2>
            <p>Adicione itens no array <b>codeSnippets</b>, lá no início do script desta página.</p>
          </div>`;
        document.getElementById("codigos-paginacao").innerHTML = "";
        return;
      }

      const inicio = (paginaAtual - 1) * PAGINA_TAMANHO;
      const itensDaPagina = codeSnippets.slice(inicio, inicio + PAGINA_TAMANHO);

      itensDaPagina.forEach((item, idxLocal) => {
        grid.appendChild(criarCardCodigo(item, idxLocal));
      });

      renderizarPaginacao();
    }

    function irParaPagina(p){
      paginaAtual = p;
      renderizarCodigos();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderizarPaginacao(){
      const nav = document.getElementById("codigos-paginacao");
      nav.innerHTML = "";
      const total = totalPaginas();
      if (total <= 1) return;

      const btnAnterior = document.createElement("button");
      btnAnterior.className = "pag-btn";
      btnAnterior.textContent = "‹ Anterior";
      btnAnterior.disabled = paginaAtual === 1;
      btnAnterior.addEventListener("click", () => {
        if (paginaAtual > 1) irParaPagina(paginaAtual - 1);
      });
      nav.appendChild(btnAnterior);

      for (let p = 1; p <= total; p++){
        const btn = document.createElement("button");
        btn.className = "pag-btn" + (p === paginaAtual ? " ativo" : "");
        btn.textContent = String(p);
        btn.addEventListener("click", () => irParaPagina(p));
        nav.appendChild(btn);
      }

      const btnProximo = document.createElement("button");
      btnProximo.className = "pag-btn";
      btnProximo.textContent = "Próxima ›";
      btnProximo.disabled = paginaAtual === total;
      btnProximo.addEventListener("click", () => {
        if (paginaAtual < total) irParaPagina(paginaAtual + 1);
      });
      nav.appendChild(btnProximo);
    }

    renderizarCodigos();

    function createStars() {
      const container = document.getElementById('star-container');
      if(!container) return;
      container.innerHTML = "";
      const starCount = 120;
      for (let i = 0; i < starCount; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        const size = (Math.random() * 3 + 1) + 'px';
        star.style.width = size;
        star.style.height = size;
        star.style.top = Math.random() * 100 + 'vh';
        star.style.left = Math.random() * 100 + 'vw';
        star.style.animationDelay = Math.random() * 5 + 's';
        container.appendChild(star);
      }
    }
    createStars();
  </script>
