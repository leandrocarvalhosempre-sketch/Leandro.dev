<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Misturador de Cores CSS</title>
<style>
  :root {
    --gold: #d4af37;
    --green: #00ff88;
    --bg: #0a0a0f;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 20% 20%, rgba(212,175,55,0.08), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(0,255,136,0.08), transparent 40%);
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #eee;
    padding: 40px 16px 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1 {
    background: linear-gradient(90deg, var(--gold), var(--green));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-size: 2rem;
    margin-bottom: 8px;
    text-align: center;
  }

  .subtitle {
    color: #999;
    margin-bottom: 28px;
    font-size: 0.9rem;
    text-align: center;
  }

  .wrap {
    width: 100%;
    max-width: 560px;
  }

  .card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(212,175,55,0.25);
    border-radius: 16px;
    backdrop-filter: blur(12px);
    padding: 22px;
    margin-bottom: 20px;
  }

  /* Quadrado de seleção (saturação x brilho) */
  .sv-square {
    position: relative;
    width: 100%;
    aspect-ratio: 1.6 / 1;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.15);
    cursor: crosshair;
    touch-action: none;
    background-color: hsl(20, 100%, 50%);
    background-image:
      linear-gradient(to top, #000, rgba(0,0,0,0)),
      linear-gradient(to right, #fff, rgba(255,255,255,0));
    margin-bottom: 16px;
    overflow: hidden;
  }

  .sv-handle {
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 3px solid #fff;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.4), 0 2px 8px rgba(0,0,0,0.5);
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  /* Slider de matiz */
  .hue-slider {
    position: relative;
    width: 100%;
    height: 18px;
    border-radius: 9px;
    background: linear-gradient(to right,
      #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000);
    touch-action: none;
    cursor: pointer;
    margin-bottom: 20px;
    border: 1px solid rgba(255,255,255,0.15);
  }

  .hue-handle {
    position: absolute;
    top: 50%;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 3px solid #fff;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.4), 0 2px 8px rgba(0,0,0,0.5);
    transform: translate(-50%, -50%);
    pointer-events: none;
    background: hsl(20, 100%, 50%);
  }

  .current-row {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .current-swatch {
    width: 56px;
    height: 56px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.15);
    flex-shrink: 0;
    background: hsl(20, 100%, 50%);
  }

  .formats {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
  }

  .format-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Courier New', monospace;
    font-size: 0.82rem;
  }

  .format-row .label {
    color: var(--green);
    font-weight: bold;
    font-family: 'Segoe UI', sans-serif;
    font-size: 0.68rem;
    min-width: 30px;
  }

  .format-row .val {
    color: #ddd;
    flex: 1;
    overflow-x: auto;
    white-space: nowrap;
  }

  .copy-btn {
    background: rgba(212,175,55,0.15);
    color: var(--gold);
    border: 1px solid rgba(212,175,55,0.4);
    padding: 4px 10px;
    font-size: 0.68rem;
    border-radius: 6px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .copy-btn:hover { background: rgba(212,175,55,0.25); }
  .copy-btn.copied {
    background: rgba(0,255,136,0.2);
    color: var(--green);
    border-color: var(--green);
  }

  .add-mix-btn {
    background: linear-gradient(90deg, var(--gold), #b8933a);
    color: #0a0a0f;
    border: none;
    padding: 10px 16px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 0.82rem;
    cursor: pointer;
    margin-top: 16px;
    width: 100%;
  }

  .add-mix-btn:hover { filter: brightness(1.1); }

  .section-title {
    font-size: 0.8rem;
    color: #999;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .mix-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
    min-height: 40px;
  }

  .mix-chip {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.15);
    position: relative;
    cursor: pointer;
  }

  .mix-chip .x {
    position: absolute;
    top: -6px;
    right: -6px;
    width: 16px;
    height: 16px;
    background: #222;
    border: 1px solid #666;
    border-radius: 50%;
    font-size: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ccc;
  }

  .mix-empty {
    color: #666;
    font-size: 0.82rem;
    padding: 10px 0;
  }

  .mix-result {
    display: flex;
    align-items: center;
    gap: 14px;
    padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
</style>
</head>
<body>

<div class="wrap">
  <h1>Misturador de Cores</h1>
  <p class="subtitle">Escolha uma cor, adicione à mistura e veja o código resultante</p>

  <div class="card">
    <div class="sv-square" id="svSquare">
      <div class="sv-handle" id="svHandle"></div>
    </div>

    <div class="hue-slider" id="hueSlider">
      <div class="hue-handle" id="hueHandle"></div>
    </div>

    <div class="current-row">
      <div class="current-swatch" id="currentSwatch"></div>
      <div class="formats" id="currentFormats"></div>
    </div>

    <button class="add-mix-btn" id="addMixBtn">+ Adicionar à mistura</button>
  </div>

  <div class="card">
    <div class="section-title">Cores na mistura (clique para remover)</div>
    <div class="mix-list" id="mixList">
      <span class="mix-empty">Nenhuma cor adicionada ainda</span>
    </div>

    <div class="mix-result" id="mixResult" style="display:none;">
      <div class="current-swatch" id="mixSwatch"></div>
      <div class="formats" id="mixFormats"></div>
    </div>
  </div>
</div>

<script>
  const svSquare = document.getElementById('svSquare');
  const svHandle = document.getElementById('svHandle');
  const hueSlider = document.getElementById('hueSlider');
  const hueHandle = document.getElementById('hueHandle');
  const currentSwatch = document.getElementById('currentSwatch');
  const currentFormats = document.getElementById('currentFormats');
  const mixList = document.getElementById('mixList');
  const mixResult = document.getElementById('mixResult');
  const mixSwatch = document.getElementById('mixSwatch');
  const mixFormats = document.getElementById('mixFormats');

  let hue = 20;
  let sat = 100; // 0-100 (eixo X do quadrado)
  let val = 100; // 0-100 (eixo Y do quadrado, brilho)
  let mixColors = [];

  function hsvToRgb(h, s, v) {
    s /= 100; v /= 100;
    const c = v * s;
    const x = c * (1 - Math.abs((h / 60) % 2 - 1));
    const m = v - c;
    let r, g, b;
    if (h < 60) [r, g, b] = [c, x, 0];
    else if (h < 120) [r, g, b] = [x, c, 0];
    else if (h < 180) [r, g, b] = [0, c, x];
    else if (h < 240) [r, g, b] = [0, x, c];
    else if (h < 300) [r, g, b] = [x, 0, c];
    else [r, g, b] = [c, 0, x];
    return {
      r: Math.round((r + m) * 255),
      g: Math.round((g + m) * 255),
      b: Math.round((b + m) * 255)
    };
  }

  function rgbToHex(r, g, b) {
    return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
  }

  function rgbToHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h, s, l = (max + min) / 2;
    if (max === min) { h = s = 0; }
    else {
      const d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      switch (max) {
        case r: h = (g - b) / d + (g < b ? 6 : 0); break;
        case g: h = (b - r) / d + 2; break;
        case b: h = (r - g) / d + 4; break;
      }
      h /= 6;
    }
    return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) };
  }

  function copyText(text, btn) {
    navigator.clipboard.writeText(text).then(() => {
      const original = btn.textContent;
      btn.textContent = 'Copiado!';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = original;
        btn.classList.remove('copied');
      }, 1200);
    });
  }

  function buildFormatsHtml(hex, rgbStr, hslStr) {
    return `
      <div class="format-row">
        <span class="label">HEX</span>
        <span class="val">${hex}</span>
        <button class="copy-btn" data-copy="${hex}">Copiar</button>
      </div>
      <div class="format-row">
        <span class="label">RGB</span>
        <span class="val">${rgbStr}</span>
        <button class="copy-btn" data-copy="${rgbStr}">Copiar</button>
      </div>
      <div class="format-row">
        <span class="label">HSL</span>
        <span class="val">${hslStr}</span>
        <button class="copy-btn" data-copy="${hslStr}">Copiar</button>
      </div>
    `;
  }

  function attachCopyHandlers(container) {
    container.querySelectorAll('.copy-btn').forEach(btn => {
      btn.addEventListener('click', () => copyText(btn.dataset.copy, btn));
    });
  }

  function updateCurrent() {
    const { r, g, b } = hsvToRgb(hue, sat, val);
    const hex = rgbToHex(r, g, b);
    const rgbStr = `rgb(${r}, ${g}, ${b})`;
    const hsl = rgbToHsl(r, g, b);
    const hslStr = `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`;

    currentSwatch.style.background = hex;
    currentFormats.innerHTML = buildFormatsHtml(hex, rgbStr, hslStr);
    attachCopyHandlers(currentFormats);

    svSquare.style.backgroundColor = `hsl(${hue}, 100%, 50%)`;
    hueHandle.style.background = `hsl(${hue}, 100%, 50%)`;
  }

  function updateHandlePositions() {
    svHandle.style.left = sat + '%';
    svHandle.style.top = (100 - val) + '%';
    hueHandle.style.left = (hue / 360 * 100) + '%';
  }

  function setFromSquare(clientX, clientY) {
    const rect = svSquare.getBoundingClientRect();
    let x = (clientX - rect.left) / rect.width;
    let y = (clientY - rect.top) / rect.height;
    x = Math.max(0, Math.min(1, x));
    y = Math.max(0, Math.min(1, y));
    sat = Math.round(x * 100);
    val = Math.round((1 - y) * 100);
    updateHandlePositions();
    updateCurrent();
  }

  function setFromHueSlider(clientX) {
    const rect = hueSlider.getBoundingClientRect();
    let x = (clientX - rect.left) / rect.width;
    x = Math.max(0, Math.min(1, x));
    hue = Math.round(x * 360);
    updateHandlePositions();
    updateCurrent();
  }

  function dragify(el, onMove) {
    el.addEventListener('pointerdown', (e) => {
      el.setPointerCapture(e.pointerId);
      onMove(e.clientX, e.clientY);
      function move(ev) { onMove(ev.clientX, ev.clientY); }
      function up() {
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', up);
      }
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
    });
  }

  dragify(svSquare, setFromSquare);
  dragify(hueSlider, (x) => setFromHueSlider(x));

  document.getElementById('addMixBtn').addEventListener('click', () => {
    const { r, g, b } = hsvToRgb(hue, sat, val);
    mixColors.push({ r, g, b });
    renderMix();
  });

  function renderMix() {
    mixList.innerHTML = '';
    if (mixColors.length === 0) {
      mixList.innerHTML = '<span class="mix-empty">Nenhuma cor adicionada ainda</span>';
      mixResult.style.display = 'none';
      return;
    }

    mixColors.forEach((c, i) => {
      const chip = document.createElement('div');
      chip.className = 'mix-chip';
      chip.style.background = rgbToHex(c.r, c.g, c.b);
      chip.innerHTML = '<span class="x">✕</span>';
      chip.addEventListener('click', () => {
        mixColors.splice(i, 1);
        renderMix();
      });
      mixList.appendChild(chip);
    });

    // Calcula a média das cores misturadas
    const total = mixColors.reduce((acc, c) => {
      acc.r += c.r; acc.g += c.g; acc.b += c.b;
      return acc;
    }, { r: 0, g: 0, b: 0 });

    const n = mixColors.length;
    const r = Math.round(total.r / n);
    const g = Math.round(total.g / n);
    const b = Math.round(total.b / n);
    const hex = rgbToHex(r, g, b);
    const rgbStr = `rgb(${r}, ${g}, ${b})`;
    const hsl = rgbToHsl(r, g, b);
    const hslStr = `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`;

    mixSwatch.style.background = hex;
    mixFormats.innerHTML = buildFormatsHtml(hex, rgbStr, hslStr);
    attachCopyHandlers(mixFormats);
    mixResult.style.display = 'flex';
  }

  updateHandlePositions();
  updateCurrent();
</script>

</body>
</html>
