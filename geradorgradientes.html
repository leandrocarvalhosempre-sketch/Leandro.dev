<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Gradientes CSS</title>
<style>
  :root {
    --gold: #d4af37;
    --green: #00ff88;
    --bg: #0a0a0f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 20% 20%, rgba(212,175,55,0.08), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(0,255,136,0.08), transparent 40%);
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #eee;
    padding: 40px 16px 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1 {
    background: linear-gradient(90deg, var(--gold), var(--green));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-size: 2rem;
    margin-bottom: 8px;
    text-align: center;
  }

  .subtitle {
    color: #999;
    margin-bottom: 28px;
    font-size: 0.9rem;
    text-align: center;
  }

  .wrap {
    width: 100%;
    max-width: 760px;
  }

  .preview {
    width: 100%;
    height: 220px;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.1);
    margin-bottom: 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }

  .card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(212,175,55,0.25);
    border-radius: 16px;
    backdrop-filter: blur(12px);
    padding: 22px;
    margin-bottom: 20px;
  }

  .mode-row {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }

  .toggle {
    display: flex;
    border: 1px solid rgba(212,175,55,0.4);
    border-radius: 10px;
    overflow: hidden;
  }

  .toggle button {
    background: transparent;
    border: none;
    color: #bbb;
    padding: 9px 18px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
  }

  .toggle button.active {
    background: linear-gradient(90deg, var(--gold), #b8933a);
    color: #0a0a0f;
  }

  .angle-box {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 6px 12px;
  }

  .angle-box input[type="number"] {
    width: 55px;
    background: transparent;
    border: none;
    color: var(--green);
    font-size: 0.9rem;
    font-family: 'Courier New', monospace;
  }

  .angle-box span { color: #888; font-size: 0.8rem; }

  /* Slider de paradas */
  .stops-label {
    font-size: 0.8rem;
    color: #999;
    margin-bottom: 10px;
  }

  .track-container {
    position: relative;
    height: 40px;
    margin-bottom: 14px;
    padding: 0 12px;
  }

  .track {
    position: absolute;
    top: 50%;
    left: 12px;
    right: 12px;
    height: 14px;
    transform: translateY(-50%);
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.15);
    cursor: copy;
  }

  .stop-handle {
    position: absolute;
    top: 50%;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 3px solid #fff;
    transform: translate(-50%, -50%);
    cursor: grab;
    box-shadow: 0 2px 8px rgba(0,0,0,0.6);
  }

  .stop-handle.selected {
    border-color: var(--green);
  }

  .stop-handle:active { cursor: grabbing; }

  .add-hint {
    font-size: 0.75rem;
    color: #666;
    margin-bottom: 20px;
  }

  .stop-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .stop-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 8px 10px;
  }

  .stop-row.selected {
    border-color: var(--green);
  }

  .swatch-input {
    width: 34px;
    height: 34px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    padding: 0;
    background: none;
    flex-shrink: 0;
  }

  .stop-row input[type="text"] {
    background: transparent;
    border: none;
    color: #ddd;
    font-family: 'Courier New', monospace;
    font-size: 0.85rem;
    width: 90px;
  }

  .stop-row .pos {
    background: transparent;
    border: none;
    color: var(--gold);
    font-family: 'Courier New', monospace;
    font-size: 0.85rem;
    width: 45px;
    text-align: right;
  }

  .stop-row .pos-suffix { color: #888; font-size: 0.8rem; }

  .stop-row .remove {
    margin-left: auto;
    background: transparent;
    border: none;
    color: #888;
    cursor: pointer;
    font-size: 1.1rem;
    padding: 4px 8px;
  }

  .stop-row .remove:hover { color: #ff5555; }

  .add-stop-btn {
    background: transparent;
    border: 1px dashed rgba(212,175,55,0.5);
    color: var(--gold);
    padding: 10px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.85rem;
    margin-top: 12px;
    width: 100%;
  }

  .add-stop-btn:hover {
    background: rgba(212,175,55,0.08);
  }

  .code-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }

  .code-block {
    flex: 1;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 14px;
    font-family: 'Courier New', monospace;
    font-size: 0.85rem;
    color: #9adfae;
    white-space: pre-wrap;
    word-break: break-all;
  }

  .copy-btn {
    background: rgba(212,175,55,0.15);
    color: var(--gold);
    border: 1px solid rgba(212,175,55,0.4);
    padding: 10px 16px;
    font-size: 0.8rem;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .copy-btn:hover {
    background: rgba(212,175,55,0.25);
  }

  .copy-btn.copied {
    background: rgba(0,255,136,0.2);
    color: var(--green);
    border-color: var(--green);
  }

  .presets {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 8px;
  }

  .preset {
    width: 70px;
    height: 44px;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.1);
    transition: transform 0.15s ease;
  }

  .preset:hover { transform: scale(1.08); }

  .section-title {
    font-size: 0.8rem;
    color: #999;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<div class="wrap">
  <h1>Gerador de Gradientes CSS</h1>
  <p class="subtitle">Arraste as paradas, ajuste as cores e copie o código pronto</p>

  <div class="preview" id="preview"></div>

  <div class="card">
    <div class="mode-row">
      <div class="toggle">
        <button id="btnLinear" class="active">Linear</button>
        <button id="btnRadial">Radial</button>
      </div>
      <div class="angle-box" id="angleBox">
        <span>Ângulo</span>
        <input type="number" id="angleInput" value="90" min="0" max="360">
        <span>°</span>
      </div>
    </div>

    <div class="stops-label">Paradas de cor</div>
    <div class="track-container">
      <div class="track" id="track"></div>
    </div>
    <div class="add-hint">Clique na barra para adicionar uma parada</div>

    <div class="stop-list" id="stopList"></div>

    <button class="add-stop-btn" id="addStopBtn">+ Adicionar parada</button>
  </div>

  <div class="card">
    <div class="section-title">Presets rápidos</div>
    <div class="presets" id="presets"></div>
  </div>

  <div class="card">
    <div class="section-title">Código CSS</div>
    <div class="code-row">
      <div class="code-block" id="cssCode"></div>
      <button class="copy-btn" id="copyBtn">Copiar</button>
    </div>
  </div>
</div>

<script>
  const track = document.getElementById('track');
  const preview = document.getElementById('preview');
  const stopList = document.getElementById('stopList');
  const cssCode = document.getElementById('cssCode');
  const angleInput = document.getElementById('angleInput');
  const angleBox = document.getElementById('angleBox');
  const btnLinear = document.getElementById('btnLinear');
  const btnRadial = document.getElementById('btnRadial');

  let mode = 'linear';
  let angle = 90;
  let selectedId = null;
  let idCounter = 0;

  let stops = [
    { id: idCounter++, hex: '#d4af37', pos: 0 },
    { id: idCounter++, hex: '#00ff88', pos: 50 },
    { id: idCounter++, hex: '#0a0a0f', pos: 100 }
  ];

  function sortedStops() {
    return [...stops].sort((a, b) => a.pos - b.pos);
  }

  function buildGradientCss() {
    const stopsCss = sortedStops().map(s => `${s.hex} ${s.pos}%`).join(', ');
    if (mode === 'linear') {
      return `linear-gradient(${angle}deg, ${stopsCss})`;
    }
    return `radial-gradient(circle, ${stopsCss})`;
  }

  function render() {
    const gradient = buildGradientCss();
    preview.style.background = gradient;
    track.style.background = gradient.replace('circle, ', '').startsWith('linear')
      ? `linear-gradient(90deg, ${sortedStops().map(s => `${s.hex} ${s.pos}%`).join(', ')})`
      : `linear-gradient(90deg, ${sortedStops().map(s => `${s.hex} ${s.pos}%`).join(', ')})`;

    cssCode.textContent = `background: ${gradient};`;

    // Render handles
    track.querySelectorAll('.stop-handle').forEach(el => el.remove());
    stops.forEach(s => {
      const handle = document.createElement('div');
      handle.className = 'stop-handle' + (s.id === selectedId ? ' selected' : '');
      handle.style.left = s.pos + '%';
      handle.style.background = s.hex;
      handle.dataset.id = s.id;
      handle.addEventListener('pointerdown', onHandleDown);
      track.appendChild(handle);
    });

    // Render stop list
    stopList.innerHTML = '';
    sortedStops().forEach(s => {
      const row = document.createElement('div');
      row.className = 'stop-row' + (s.id === selectedId ? ' selected' : '');
      row.innerHTML = `
        <input type="color" class="swatch-input" value="${s.hex}">
        <input type="text" class="hex-text" value="${s.hex}">
        <input type="number" class="pos" value="${s.pos}" min="0" max="100">
        <span class="pos-suffix">%</span>
        <button class="remove">✕</button>
      `;
      row.addEventListener('click', () => { selectedId = s.id; render(); });

      const colorInput = row.querySelector('.swatch-input');
      colorInput.addEventListener('input', (e) => {
        s.hex = e.target.value;
        render();
      });

      const hexText = row.querySelector('.hex-text');
      hexText.addEventListener('change', (e) => {
        let val = e.target.value.trim();
        if (!val.startsWith('#')) val = '#' + val;
        if (/^#[0-9A-Fa-f]{6}$/.test(val)) {
          s.hex = val;
          render();
        }
      });
      hexText.addEventListener('click', (e) => e.stopPropagation());

      const posInput = row.querySelector('.pos');
      posInput.addEventListener('change', (e) => {
        let v = parseFloat(e.target.value);
        if (isNaN(v)) v = 0;
        v = Math.max(0, Math.min(100, v));
        s.pos = v;
        render();
      });
      posInput.addEventListener('click', (e) => e.stopPropagation());

      const removeBtn = row.querySelector('.remove');
      removeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (stops.length <= 2) return;
        stops = stops.filter(st => st.id !== s.id);
        render();
      });

      stopList.appendChild(row);
    });
  }

  function onHandleDown(e) {
    const id = parseInt(e.target.dataset.id);
    selectedId = id;
    e.target.setPointerCapture(e.pointerId);

    function onMove(ev) {
      const rect = track.getBoundingClientRect();
      let pct = ((ev.clientX - rect.left) / rect.width) * 100;
      pct = Math.max(0, Math.min(100, pct));
      const stop = stops.find(s => s.id === id);
      stop.pos = Math.round(pct);
      render();
    }
    function onUp() {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
    }
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  }

  track.addEventListener('click', (e) => {
    if (e.target !== track) return;
    const rect = track.getBoundingClientRect();
    let pct = ((e.clientX - rect.left) / rect.width) * 100;
    pct = Math.round(Math.max(0, Math.min(100, pct)));
    const newStop = { id: idCounter++, hex: '#ffffff', pos: pct };
    stops.push(newStop);
    selectedId = newStop.id;
    render();
  });

  document.getElementById('addStopBtn').addEventListener('click', () => {
    const newStop = { id: idCounter++, hex: '#ffffff', pos: 50 };
    stops.push(newStop);
    selectedId = newStop.id;
    render();
  });

  btnLinear.addEventListener('click', () => {
    mode = 'linear';
    btnLinear.classList.add('active');
    btnRadial.classList.remove('active');
    angleBox.style.display = 'flex';
    render();
  });

  btnRadial.addEventListener('click', () => {
    mode = 'radial';
    btnRadial.classList.add('active');
    btnLinear.classList.remove('active');
    angleBox.style.display = 'none';
    render();
  });

  angleInput.addEventListener('input', (e) => {
    angle = parseInt(e.target.value) || 0;
    render();
  });

  document.getElementById('copyBtn').addEventListener('click', () => {
    navigator.clipboard.writeText(cssCode.textContent).then(() => {
      const btn = document.getElementById('copyBtn');
      const original = btn.textContent;
      btn.textContent = 'Copiado!';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = original;
        btn.classList.remove('copied');
      }, 1500);
    });
  });

  // Presets
  const presetList = [
    ['#d4af37', '#00ff88'],
    ['#0a0a0f', '#d4af37'],
    ['#00ff88', '#0a0a0f'],
    ['#ff6b6b', '#4ecdc4'],
    ['#667eea', '#764ba2'],
    ['#f093fb', '#f5576c']
  ];

  const presetsEl = document.getElementById('presets');
  presetList.forEach(colors => {
    const div = document.createElement('div');
    div.className = 'preset';
    div.style.background = `linear-gradient(90deg, ${colors[0]}, ${colors[1]})`;
    div.addEventListener('click', () => {
      stops = [
        { id: idCounter++, hex: colors[0], pos: 0 },
        { id: idCounter++, hex: colors[1], pos: 100 }
      ];
      selectedId = null;
      render();
    });
    presetsEl.appendChild(div);
  });

  render();
</script>

</body>
</html>
